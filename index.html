<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafe Park Avenue</title>
  <style>
    :root{
      --bg: #f3efe7;
      --bg-2: #efe7dc;
      --panel: #f1eadf;
      --card: #fbf8f3;
      --green: #0e5d4a;
      --green-2: #2c7e5a;
      --green-soft: #5a9d74;
      --brown: #4a2d20;
      --brown-2: #8d593b;
      --beige: #e9dfd1;
      --text: #1f1f1f;
      --muted: #69615b;
      --line: rgba(37, 34, 31, 0.1);
      --shadow: rgba(27, 21, 18, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      background: var(--bg);
    }

    .topbar {
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px 0 26px;
      background: rgba(255,255,255,0.08);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 230px;
    }

    .logo {
      width: 52px;
      height: 52px;
      position: relative;
      border: 2px solid var(--green);
      border-radius: 50%;
      background: transparent;
      flex-shrink: 0;
    }

    .logo::before,
    .logo::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--green);
    }

    .logo::before {
      width: 18px;
      height: 18px;
      left: 11px;
      top: 12px;
      border-right-color: transparent;
      border-bottom-color: transparent;
      transform: rotate(-26deg);
    }

    .logo::after {
      width: 16px;
      height: 16px;
      right: 9px;
      top: 18px;
      border-left-color: transparent;
      border-top-color: transparent;
      transform: rotate(38deg);
    }

    .mini-leaf {
      position: absolute;
      width: 13px;
      height: 13px;
      border: 2px solid var(--green);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      left: 20px;
      top: 8px;
      background: transparent;
    }

    .mini-leaf::before,
    .mini-leaf::after {
      content: "";
      position: absolute;
      background: transparent;
      border: 2px solid var(--green);
      border-radius: 50% 50% 0 50%;
    }

    .mini-leaf::before {
      width: 9px;
      height: 9px;
      left: -10px;
      top: 2px;
      transform: rotate(-18deg);
    }

    .mini-leaf::after {
      width: 9px;
      height: 9px;
      right: -10px;
      bottom: 2px;
      transform: rotate(18deg);
    }

    .brand-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      line-height: 1.1;
      letter-spacing: 0.1px;
      color: var(--green);
      font-weight: 600;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-name strong {
      font-size: 18px;
      letter-spacing: 0.2px;
    }

    .brand-name span {
      letter-spacing: 0.75px;
      color: rgba(16, 74, 62, 0.9);
      font-size: 9px;
      text-transform: uppercase;
      font-family: "Segoe UI", sans-serif;
      font-weight: 700;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 52px;
      flex: 1;
      min-width: 0;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      line-height: 1.2;
    }

    .nav a:hover { text-decoration: underline; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 240px;
      justify-content: flex-end;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: rgba(23,23,23,0.8);
      white-space: nowrap;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green-2);
      box-shadow: 0 0 0 2px rgba(47,124,88,0.15);
    }

    .reserve-btn {
      background: rgba(88, 59, 45, 0.95);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(73, 52, 40, 0.08);
    }

    .main-wrap {
      padding: 18px 24px 0 24px;
    }

    .menu-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 0 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .chips {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid rgba(42,37,31,0.18);
      background: rgba(255,255,255,0.2);
      color: rgba(32, 28, 20, 0.9);
      font-size: 15px;
      line-height: 1;
      cursor: default;
    }

    .chip.active {
      background: rgba(255,255,255,0.1);
      border-color: rgba(42,37,31,0.24);
      font-weight: 600;
    }

    .see-all {
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      white-space: nowrap;
      margin-left: 14px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.08fr 1.25fr;
      align-items: center;
      padding-top: 18px;
      min-height: 630px;
      gap: 8px;
    }

    .left-col {
      padding-left: 4px;
    }

    .badge {
      display: inline-block;
      font-size: 14px;
      font-weight: 600;
      color: var(--green);
      margin-bottom: 22px;
      padding-left: 4px;
    }

    .badge::before {
      content: "•";
      display: inline-block;
      margin-right: 9px;
      font-size: 18px;
      color: var(--green);
      transform: translateY(-1px);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 3.6vw, 102px);
      line-height: 0.9;
      letter-spacing: -2px;
      color: #1d1d1d;
      font-weight: 700;
    }

    .cta {
      display: flex;
      gap: 18px;
      margin-top: 30px;
      align-items: center;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      height: 58px;
      padding: 0 26px;
      border-radius: 999px;
      border: 1px solid rgba(18, 18, 18, 0.15);
      font-weight: 600;
      font-size: 18px;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .button.primary {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
      box-shadow: 0 12px 24px rgba(19, 90, 65, 0.14);
    }

    .button.secondary {
      background: transparent;
      color: var(--green);
      border-color: rgba(15, 89, 71, 0.55);
    }

    .button:hover {
      transform: translateY(-1px);
      filter: brightness(0.98);
    }

    .right-col {
      height: 100%;
      display: flex;
      align-items: end;
      justify-content: center;
      padding-bottom: 2px;
    }

    .cake-scene {
      position: relative;
      width: 760px;
      height: 610px;
      display: flex;
      align-items: end;
      justify-content: center;
    }

    .cake {
      position: relative;
      width: 620px;
      height: 480px;
      border-radius: 50% 50% 46% 46% / 52% 52% 38% 38%;
      background:
        radial-gradient(circle at 50% 30%, #f8f4ef 0%, #efe6d8 24%, #f0e7db 39%, #f9f8f5 55%, #f4ede5 100%);
      box-shadow:
        inset -18px -18px 0 rgba(117, 73, 43, 0.05),
        inset 18px 20px 0 rgba(255,255,255,0.38),
        0 24px 26px rgba(96, 76, 50, 0.09);
      border: 12px solid rgba(138, 85, 53, 0.08);
      transform: translateY(40px);
    }

    .cake::before {
      content: "";
      position: absolute;
      left: 54px;
      right: 54px;
      top: 54px;
      bottom: 56px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 20% 15%, rgba(134, 82, 45, 0.6) 0 16%, transparent 17%),
        radial-gradient(circle at 74% 17%, rgba(134, 82, 45, 0.6) 0 15%, transparent 16%),
        radial-gradient(circle at 58% 28%, rgba(134, 82, 45, 0.65) 0 14%, transparent 15%),
        radial-gradient(circle at 35% 42%, rgba(134, 82, 45, 0.6) 0 14%, transparent 15%),
        radial-gradient(circle at 72% 58%, rgba(134, 82, 45, 0.6) 0 15%, transparent 16%),
        radial-gradient(circle at 24% 68%, rgba(134, 82, 45, 0.64) 0 13%, transparent 14%),
        radial-gradient(circle at 62% 72%, rgba(134, 82, 45, 0.64) 0 14%, transparent 15%),
        radial-gradient(circle at 44% 77%, rgba(134, 82, 45, 0.62) 0 12%, transparent 13%),
        linear-gradient(135deg, rgba(20, 20, 20, 0.18), rgba(255,255,255,0.03));
      opacity: 0.9;
      filter: blur(0.2px);
    }

    .cake::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(circle at 50% 50%, rgba(80,52,35,0.04), transparent 58%),
        linear-gradient(180deg, rgba(0,0,0,0.03), rgba(0,0,0,0));
      pointer-events: none;
    }

    .drip {
      position: absolute;
      width: 18px;
      height: 74px;
      background: linear-gradient(180deg, #774a2a 0%, #4a2b1d 100%);
      border-radius: 12px 12px 16px 16px;
      top: 86px;
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.18),
        inset 0 0 0 1px rgba(0,0,0,0.08);
    }

    .drip:nth-child(1){ left: 68px; }
    .drip:nth-child(2){ left: 148px; }
    .drip:nth-child(3){ left: 270px; }
    .drip:nth-child(4){ left: 388px; }
    .drip:nth-child(5){ left: 490px; }

    .drip::after {
      content: "";
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(180deg, #6b3b1c, #4d2a1c);
    }

    .frosting {
      position: absolute;
      inset: 12px 26px auto 26px;
      height: 64%;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(248,244,239,0.9));
      border: 8px solid rgba(137, 89, 54, 0.05);
      overflow: hidden;
    }

    .frosting::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 12% 10%, rgba(128, 74, 42, 0.7) 0 10%, transparent 10.5%),
        radial-gradient(circle at 28% 18%, rgba(128, 74, 42, 0.7) 0 10%, transparent 10.5%),
        radial-gradient(circle at 42% 14%, rgba(128, 74, 42, 0.7) 0 10%, transparent 10.5%),
        radial-gradient(circle at 56% 28%, rgba(128, 74, 42, 0.7) 0 10%, transparent 10.5%),
        radial-gradient(circle at 72% 14%, rgba(128, 74, 42, 0.7) 0 10%, transparent 10.5%),
        radial-gradient(circle at 88% 25%, rgba(128, 74, 42, 0.7) 0 10%, transparent 10.5%);
      opacity: 0.7;
    }

    .frosting::after {
      content: "";
      position: absolute;
      width: 88%;
      height: 32%;
      left: 6%;
      bottom: 14%;
      background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(240,230,220,0.75));
      border-radius: 50%;
      transform: rotate(-3deg);
    }

    .cocoa-band {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 42%;
      height: 20px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(106,67,43,0.95), rgba(78,52,35,0.9), rgba(111,71,46,0.95));
      box-shadow: 0 8px 14px rgba(80,55,38,0.12);
    }

    .cocoa-band::before,
    .cocoa-band::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(45,30,23,0.5);
      top: 4px;
    }

    .cocoa-band::before { left: 18px; }
    .cocoa-band::after { right: 18px; }

    .cake-slice {
      position: absolute;
      width: 92%;
      height: 92%;
      left: 4%;
      top: 3%;
      border-radius: 50%;
      background:
        repeating-linear-gradient(0deg, transparent 0 16px, rgba(255,255,255,0.2) 16px 17px),
        repeating-linear-gradient(90deg, transparent 0 16px, rgba(255,255,255,0.18) 16px 17px),
        radial-gradient(circle at center, rgba(255,255,255,0.06), transparent 60%);
      opacity: 0.7;
      pointer-events: none;
    }

    .coffee-cup {
      position: absolute;
      width: 170px;
      height: 120px;
      right: 70px;
      bottom: 42px;
      background: linear-gradient(180deg, #1a5f4d 0%, #0d4f3f 100%);
      border-radius: 0 0 52px 52px / 0 0 80px 80px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06), 0 18px 18px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .coffee-cup::before {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 14px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
    }

    .coffee-cup::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 42px;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border-radius: 50%;
    }

    .cup-handle {
      position: absolute;
      width: 82px;
      height: 70px;
      border: 12px solid var(--green);
      border-left-color: transparent;
      border-radius: 50%;
      right: -42px;
      top: 28px;
      background: transparent;
      box-sizing: border-box;
    }

    .coffee {
      position: absolute;
      width: 100px;
      height: 52px;
      left: 50%;
      top: -12px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, #f7ecdd 0%, #e9d7b4 48%, #d4b88b 100%);
      box-shadow: inset 0 0 0 8px rgba(255,255,255,0.12);
    }

    .coffee::before {
      content: "";
      position: absolute;
      width: 62px;
      height: 18px;
      left: 18px;
      top: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transform: rotate(-8deg);
    }

    .coffee::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 34px;
      height: 18px;
      border-radius: 50%;
      border-bottom: 3px solid rgba(117, 78, 39, 0.7);
      transform: translateX(-50%) rotate(8deg);
    }

    .foot {
      position: absolute;
      width: 300px;
      height: 34px;
      right: 144px;
      bottom: 10px;
      background: rgba(0,0,0,0.04);
      border-radius: 50%;
      filter: blur(2px);
    }

    .bottom-strip {
      border-top: 1px solid var(--line);
      margin-top: 18px;
      padding: 18px 0 28px 0;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(30,30,30,0.5);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .bottom-strip .small {
      opacity: 0.75;
    }

    @media (max-width: 1100px){
      .hero {
        grid-template-columns: 1fr;
      }

      .right-col {
        justify-content: center;
      }

      .cake-scene {
        transform: scale(0.82);
      }
    }

    @media (max-width: 780px){
      .topbar {
        flex-wrap: wrap;
        height: auto;
        padding: 18px 18px 16px;
        gap: 12px;
      }

      .nav {
        order: 3;
        width: 100%;
        justify-content: flex-start;
        flex-wrap: wrap;
        gap: 18px 22px;
      }

      .brand { min-width: auto; }

      .main-wrap { padding: 18px 18px 0 18px; }

      .menu-row {
        display: block;
      }

      .chips {
        margin-bottom: 12px;
      }

      .see-all {
        padding-left: 2px;
      }

      h1 {
        font-size: 52px;
      }

      .cake-scene {
        transform: scale(0.62);
        transform-origin: center top;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <span class="mini-leaf"></span>
        </div>
        <div class="brand-name">
          <strong>Cafe</strong>
          <span>Park Avenue</span>
        </div>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <a href="#">Про нас</a>
        <a href="#">Меню</a>
        <a href="#">Галерея</a>
        <a href="#">Відгуки</a>
        <a href="#">Контакти</a>
      </nav>

      <div class="header-actions">
        <button class="reserve-btn">Забронювати</button>
      </div>
    </header>

    <div class="main-wrap">
      <div class="menu-row">
        <div class="chips">
          <div class="chip active">Кава</div>
          <div class="chip">Десерти</div>
          <div class="chip">Випічка</div>
          <div class="chip">Сніданки</div>
          <div class="chip">Напої</div>
        </div>

        <a href="#" class="see-all">Усе меню →</a>
      </div>

      <section class="hero">
        <div class="left-col">
          <div class="badge">Відкрите зараз до 20:00</div>

          <h1>
            Авторські торти та<br>
            запашна кава для<br>
            особливих моментів
          </h1>

          <div class="cta">
            <a href="#" class="button primary">Переглянути меню</a>
            <a href="#" class="button secondary">Замовити торт</a>
          </div>
        </div>

        <div class="right-col">
          <div class="cake-scene" aria-hidden="true">
            <div class="cake">
              <div class="drip"></div>
              <div class="drip"></div>
              <div class="drip"></div>
              <div class="drip"></div>
              <div class="drip"></div>

              <div class="frosting"></div>
              <div class="cocoa-band"></div>
              <div class="cake-slice"></div>
            </div>

            <div class="coffee-cup">
              <div class="cup-handle"></div>
              <div class="coffee"></div>
            </div>

            <div class="foot"></div>
          </div>
        </div>
      </section>

      <div class="bottom-strip">
        <div class="small">Функціональні можливості</div>
        <div>Що можна зробити на сайті</div>
      </div>
    </div>
  </div>
</body>
</html>
