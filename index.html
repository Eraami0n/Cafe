<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafe Park Avenue</title>
  <style>
    :root{
      --bg: #f3f2f0;
      --panel: #e6dfd3;
      --text: #2b2b2b;
      --muted: #5d5d5d;
      --purple: #4a2f4d;
      --brown: #5a3d35;
      --green: #3d8a5c;
      --orange: #cc6b3a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 0;
    }

    .page {
      width: 100%;
      display: flex;
      gap: 68px;
      padding: 20px 0 0 0;
    }

    .sidebar {
      width: 260px;
      padding-left: 26px;
      padding-top: 12px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
      color: var(--text);
      text-decoration: none;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border: 2px solid var(--brown);
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
      background: transparent;
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 3px solid var(--brown);
      border-right-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
      transform: rotate(-24deg);
      left: 10px;
      top: 10px;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-left: 2px solid var(--brown);
      border-top: 2px solid var(--brown);
      border-radius: 50%;
      transform: rotate(40deg);
      right: 7px;
      top: 16px;
      opacity: 0.9;
    }

    .brand-text {
      line-height: 1.05;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: 0.2px;
      color: var(--text);
    }

    .brand-text strong {
      display: block;
      font-weight: 600;
      font-size: 20px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }

    .nav a {
      font-size: 15px;
      line-height: 1.2;
      color: var(--purple);
      text-decoration: none;
      font-weight: 500;
      width: fit-content;
    }

    .nav a:hover { text-decoration: underline; }

    .content {
      flex: 1;
      padding-top: 18px;
      padding-left: 4px;
      max-width: 980px;
    }

    .eyebrow {
      font-size: 16px;
      line-height: 1.5;
      color: #4d4d4d;
      letter-spacing: 0.2px;
      margin-top: 10px;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .eyebrow .dot {
      margin: 0 10px;
      color: #666;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(44px, 3vw, 62px);
      letter-spacing: -1px;
      color: #1b1b1b;
      line-height: 0.96;
    }

    .lead {
      margin-top: 26px;
      max-width: 840px;
      font-size: 27px;
      line-height: 1.4;
      color: #676767;
      font-weight: 400;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .cta-link {
      color: var(--brown);
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0;
    }

    .cta-link.secondary {
      color: var(--brown);
      opacity: 0.9;
    }

    .cta-link .arrow {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--green);
      border-radius: 50%;
      position: relative;
      margin-right: 4px;
    }

    .cta-link .arrow::before {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-left: 2px solid var(--green);
      border-bottom: 2px solid var(--green);
      transform: rotate(45deg);
      left: 4px;
      top: 4px;
    }

    .features {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 420px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #2d2d2d;
      font-size: 23px;
      line-height: 1.3;
      font-weight: 400;
    }

    .feature .icon {
      width: 30px;
      height: 30px;
      display: inline-block;
      position: relative;
      flex-shrink: 0;
    }

    .feature .icon.coffee{
      border: 3px solid var(--green);
      border-radius: 10px;
      width: 28px;
      height: 24px;
      transform: translateY(1px);
    }

    .feature .icon.coffee::before {
      content: "";
      position: absolute;
      right: -9px;
      top: 7px;
      width: 10px;
      height: 10px;
      border: 3px solid var(--green);
      border-left: none;
      border-radius: 0 12px 12px 0;
    }

    .feature .icon.coffee::after {
      content: "";
      position: absolute;
      left: 5px;
      top: -8px;
      width: 10px;
      height: 8px;
      border: 3px solid var(--green);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
    }

    .feature .icon.cake {
      border: 3px solid var(--orange);
      border-radius: 10px;
      width: 28px;
      height: 22px;
      transform: translateY(2px);
      position: relative;
    }

    .feature .icon.cake::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 12px;
      left: 5px;
      top: -9px;
      border: 3px solid var(--orange);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
    }

    .feature .icon.clock {
      border: 3px solid var(--green);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      position: relative;
    }

    .feature .icon.clock::before {
      content: "";
      position: absolute;
      width: 2px;
      height: 9px;
      background: var(--green);
      left: 12px;
      top: 7px;
      border-radius: 2px;
      transform: rotate(35deg);
    }

    .feature .icon.clock::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 7px;
      background: var(--green);
      left: 13px;
      top: 13px;
      border-radius: 2px;
      transform: rotate(95deg);
    }

    .hero-panel {
      margin-top: 36px;
      width: 100%;
      max-width: 1080px;
      height: 360px;
      background: var(--panel);
      border-radius: 28px 28px 0 0;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.02);
    }

    .hero-panel::before {
      content: "";
      position: absolute;
      width: 62%;
      height: 54%;
      right: 8%;
      bottom: 20%;
      background: rgba(255,255,255,0.28);
      border-radius: 32px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
    }

    .hero-panel::after {
      content: "";
      position: absolute;
      width: 52%;
      height: 36%;
      right: 16%;
      bottom: 10%;
      background: rgba(255,255,255,0.42);
      border-radius: 26px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
    }

    @media (max-width: 900px){
      .page {
        flex-direction: column;
        gap: 24px;
      }

      .sidebar {
        width: 100%;
        padding-left: 24px;
      }

      .content {
        padding-left: 24px;
        padding-right: 24px;
      }

      .lead { font-size: 22px; }
      .hero-panel { height: 260px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="brand" aria-label="Cafe Park Avenue">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <strong>Cafe</strong>
          Park Avenue
        </div>
      </div>

      <nav class="nav" aria-label="Головне меню">
        <a href="#">Про нас</a>
        <a href="#">Меню</a>
        <a href="#">Галерея</a>
        <a href="#">Відгуки</a>
        <a href="#">Контакти</a>
        <a href="#">Забронювати</a>
      </nav>
    </aside>

    <main class="content">
      <div class="eyebrow">
        Кав'ярня <span class="dot">•</span> Кондитерська
      </div>

      <h1>Cafe Park Avenue</h1>

      <p class="lead">
        Свіжа випічка, авторські десерти та ароматна кава в затишній атмосфері.
      </p>

      <div class="cta-row">
        <a href="#" class="cta-link">
          <span class="arrow"></span>Забронювати столик
        </a>
        <a href="#" class="cta-link secondary">Переглянути меню</a>
      </div>

      <div class="features">
        <div class="feature">
          <span class="icon coffee" aria-hidden="true"></span>
          <span>Крафтова кава</span>
        </div>

        <div class="feature">
          <span class="icon cake" aria-hidden="true"></span>
          <span>Авторські десерти</span>
        </div>

        <div class="feature">
          <span class="icon clock" aria-hidden="true"></span>
          <span>Працюємо щодня</span>
        </div>
      </div>

      <div class="hero-panel" aria-hidden="true"></div>
    </main>
  </div>
</body>
</html>
